<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Earshot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235b5bd6'/%3E%3Cpath d='M7 12v0M10 9v6M13 6v12M16 9v6M19 11v2' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --sunk: #f3f3f1; --line: #e7e6e3; --line-strong: #d6d5d1;
  --text: #1c1c1a; --muted: #6b6a66; --faint: #9a9994;
  --accent: #5b5bd6; --accent-soft: #ededfc; --accent-text: #4747b8;
  --green: #2f8a57; --green-soft: #e6f4ec; --amber: #a86a12; --amber-soft: #fbf1df; --red: #c4423a; --red-soft: #fbe9e7;
  --nv: #76b900;
  --shadow: 0 1px 2px rgba(20,20,15,.04), 0 2px 8px rgba(20,20,15,.04);
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111113; --panel: #18181b; --sunk: #1f1f23; --line: #2a2a2f; --line-strong: #3a3a40;
    --text: #ececef; --muted: #a0a0a8; --faint: #6e6e76;
    --accent: #8b8bf5; --accent-soft: #24243f; --accent-text: #a9a9ff;
    --green: #5cc58a; --green-soft: #18301f; --amber: #e0a54a; --amber-soft: #33270f; --red: #f07a70; --red-soft: #3a1b18;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* layout */
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.side { border-right: 1px solid var(--line); padding: 20px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
.brand svg { flex: none; }
nav { display: flex; flex-direction: column; gap: 2px; }
.tab { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; background: none; border-radius: 7px; color: var(--muted); cursor: pointer; text-align: left; font-weight: 500; }
.tab svg { width: 16px; height: 16px; flex: none; }
.tab:hover { background: var(--sunk); color: var(--text); }
.tab[aria-selected="true"] { background: var(--sunk); color: var(--text); }
.tab .count { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; padding: 0 8px; font-size: 11.5px; color: var(--faint); line-height: 1.5; }
.side-foot b { color: var(--muted); font-weight: 600; }
.signout { margin-top: 8px; background: none; border: 0; padding: 0; color: var(--faint); cursor: pointer; font-size: 11.5px; text-decoration: underline; }
main { padding: 32px 40px 64px; max-width: 880px; width: 100%; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
h1 { font-size: 22px; letter-spacing: -.02em; margin: 0; font-weight: 650; }
.sub { color: var(--muted); margin: 2px 0 0; }
h2.group { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; margin: 28px 0 10px; display: flex; gap: 8px; align-items: center; }
h2.group .n { color: var(--muted); }
.mobilebar { display: none; }
.foot-mobile { display: none; }

/* atoms */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--sunk); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { background: var(--sunk); color: var(--text); }
.btn.danger { color: var(--red); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.dot-rec { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .3; } }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); font-size: 12px; border: 1px solid transparent; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.chip { cursor: pointer; border-color: var(--line); background: var(--panel); color: var(--text); padding: 3px 10px; }
button.chip:hover { border-color: var(--accent); }
.chip .org { color: var(--faint); }
.badge { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .02em; }
.badge.news { background: var(--amber-soft); color: var(--amber); }
.badge.fail { background: var(--red-soft); color: var(--red); }
.badge.proc { background: var(--accent-soft); color: var(--accent-text); }
.badge.due { background: var(--amber-soft); color: var(--amber); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.tnum { font-variant-numeric: tabular-nums; }
.err { background: var(--red-soft); color: var(--red); border-radius: 8px; padding: 10px 12px; margin: 12px 0; font-size: 13px; }
.note { background: var(--sunk); color: var(--muted); border-radius: 8px; padding: 10px 12px; margin: 12px 0; font-size: 13px; }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty svg { color: var(--faint); margin-bottom: 8px; }
.empty b { display: block; color: var(--text); font-weight: 600; margin-bottom: 4px; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.skel { height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--sunk), var(--line), var(--sunk)); background-size: 200% 100%; animation: sh 1.2s infinite; margin: 10px 0; }
@keyframes sh { to { background-position: -200% 0; } }
input[type=text], input[type=search], input[type=password], textarea { width: 100%; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px; padding: 8px 11px; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 72px; line-height: 1.5; }

/* today */
.daypick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.daypick button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.daypick button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.brief { padding: 8px 28px 24px; }
.brief h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-text); margin: 22px 0 8px; font-weight: 650; }
.brief h4 { font-size: 14px; margin: 16px 0 6px; }
.brief p { margin: 8px 0; }
.brief ul { margin: 6px 0; padding-left: 20px; }
.brief li { margin: 5px 0; }
.brief li::marker { color: var(--faint); }
sup.cite a { font-size: 10.5px; font-weight: 600; padding: 0 3px; border-radius: 3px; background: var(--accent-soft); margin-left: 1px; }
.sources { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 12px; font-size: 12.5px; }
.sources ol { margin: 6px 0 0; padding-left: 22px; color: var(--muted); }
.sources li { margin: 3px 0; overflow-wrap: anywhere; }
.brief-meta { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; padding-top: 16px; }

/* list rows */
.list { overflow: hidden; }
.row { padding: 14px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row-top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.row-title { font-weight: 600; }
.row-meta { color: var(--faint); font-size: 12.5px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.row-actions .saved { font-size: 12px; color: var(--faint); margin-left: auto; }
.draft-label { font-size: 12px; color: var(--muted); margin: 10px 0 4px; display: flex; align-items: center; gap: 6px; }
.row.leaving { opacity: 0; transition: opacity .25s; }
.who { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); align-items: center; justify-content: center; font-size: 11.5px; font-weight: 650; flex: none; }

/* ask */
.askbox { display: flex; gap: 8px; }
.askbox input { padding: 11px 14px; font-size: 15px; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.answer { padding: 18px 20px; margin-top: 16px; }
.answer .q { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
.answer .a { font-size: 15px; white-space: pre-wrap; }
.answer .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }

/* timeline */
.rec .sum { color: var(--muted); margin-top: 4px; }
.rec .people { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.rec details { margin-top: 8px; }
.rec summary { cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none; display: inline-flex; gap: 4px; align-items: center; }
.rec summary::-webkit-details-marker { display: none; }
.rec summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
.rec details[open] summary::before { transform: rotate(90deg); }
.facts { margin: 10px 0 0; padding-left: 18px; }
.facts li { margin: 3px 0; }
.transcript { margin-top: 12px; background: var(--sunk); border-radius: 8px; padding: 12px 14px; max-height: 360px; overflow: auto; font-size: 13px; }
.transcript p { margin: 0 0 6px; }
.transcript .spk { font-weight: 600; color: var(--accent-text); }
.rec.flash { animation: flash 2s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; min-width: 64px; }
.more { display: flex; justify-content: center; margin-top: 16px; }

/* memory */
.mem { display: flex; gap: 10px; flex-direction: column; }
.mem .tagline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
.mem .content { overflow-wrap: anywhere; }

/* privacy & cost */
.pillars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pillar { padding: 16px; }
.pillar svg { color: var(--green); }
.pillar b { display: block; margin: 6px 0 4px; }
.pillar p { margin: 0; color: var(--muted); font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; }
.kpi .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12.5px; }
.kpi.hero .v { color: var(--accent-text); }
.chart { padding: 16px 16px 10px; margin-top: 12px; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; }
.bar { flex: 1; display: flex; flex-direction: column-reverse; min-width: 0; height: 100%; justify-content: flex-start; position: relative; }
.bar span { display: block; width: 100%; }
.bar span:first-child { border-radius: 0 0 2px 2px; }
.bar span:last-child { border-radius: 3px 3px 0 0; }
.bar-x { display: flex; gap: 4px; margin-top: 6px; }
.bar-x span { flex: 1; text-align: center; font-size: 10.5px; color: var(--faint); min-width: 0; overflow: hidden; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: right; padding: 8px 12px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
th:first-child, td:first-child, .trace th:nth-child(-n+3), .trace td:nth-child(-n+3) { text-align: left; }
th { color: var(--faint); font-weight: 500; font-size: 12px; border-top: 0; }
tfoot td { font-weight: 650; }
.tablewrap { overflow-x: auto; }

/* sign in */
.signin { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.signin form { width: 100%; max-width: 360px; padding: 28px; }
.signin h1 { margin: 14px 0 4px; }
.signin label { display: block; font-size: 12.5px; color: var(--muted); margin: 18px 0 6px; }
.signin .btn { width: 100%; margin-top: 12px; padding: 9px; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mobilebar { display: block; position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px 0; }
  .mobilebar .brand { padding: 0; }
  .mobilebar nav { flex-direction: row; overflow-x: auto; gap: 2px; margin: 10px -16px 0; padding: 0 12px 8px; scrollbar-width: none; }
  .mobilebar nav::-webkit-scrollbar { display: none; }
  .mobilebar .tab { width: auto; padding: 6px 10px; white-space: nowrap; }
  .mobilebar .tab svg { display: none; }
  main { padding: 20px 16px 48px; }
  .brief { padding: 4px 16px 18px; }
  .pillars, .kpis { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis .kpi.hero { grid-column: 1 / -1; }
  .foot-mobile { display: block; text-align: center; color: var(--faint); font-size: 11.5px; padding: 0 16px 24px; }
  .askbox { flex-direction: column; }
  .row { padding: 12px 14px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script>
'use strict'
// ---------- tiny helpers ----------
const $ = (s, el = document) => el.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const store = {
  get(k) { try { return localStorage.getItem(k) } catch { return null } },
  set(k, v) { try { localStorage.setItem(k, v) } catch {} },
  del(k) { try { localStorage.removeItem(k) } catch {} },
}
const parseJSON = (s, d) => { if (s && typeof s === 'object') return s; try { return JSON.parse(s) ?? d } catch { return d } }
const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? u : '#'
const fmtTime = (ms) => new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(ms)
const fmtDay = (ms) => {
  const d = new Date(ms), t = new Date(); t.setHours(0, 0, 0, 0)
  const diff = Math.round((t - new Date(d).setHours(0, 0, 0, 0)) / 864e5)
  if (diff === 0) return 'Today'
  if (diff === 1) return 'Yesterday'
  return new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: d.getFullYear() === t.getFullYear() ? undefined : 'numeric' }).format(d)
}
const fmtWhen = (ms) => `${fmtDay(ms)}, ${fmtTime(ms)}`
// "2026-10-14" is a calendar day, not an instant: render it at local noon so no timezone shifts it.
const isoDay = (s) => new Date(`${s}T12:00:00`).getTime()
const fmtIsoDay = (s, opts = { weekday: 'short', month: 'short', day: 'numeric' }) => new Intl.DateTimeFormat(undefined, opts).format(isoDay(s))
const fmtDur = (ms) => { const m = Math.round((ms || 0) / 60000); return m < 1 ? '<1 min' : m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m` }
const fmtUsd = (n) => { n = Number(n) || 0; return '$' + (n === 0 ? '0.00' : n < 0.01 ? n.toFixed(4) : n < 1 ? n.toFixed(3) : n.toFixed(2)) }
const fmtNum = (n) => new Intl.NumberFormat(undefined, { notation: n >= 1e5 ? 'compact' : 'standard' }).format(n || 0)
const initials = (name) => String(name || '?').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase()

const icons = {
  logo: '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--accent)"/><path d="M7.5 13v0M10.5 10v6M13.5 7v12M16.5 10v6M19.5 12v2" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
  today: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1" stroke-linecap="round"/></svg>',
  promises: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3"/><path d="M5.5 8.2l1.8 1.8 3.3-3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  ask: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 7.5a5.5 5 0 1 1 2.6 4.3L2.5 13l.8-2.4a4.8 4.8 0 0 1-.8-3.1z" stroke-linejoin="round"/></svg>',
  timeline: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 8v0M6.5 5v6M9 3v10M11.5 6v4M14 7.5v1" stroke-linecap="round"/></svg>',
  memory: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/></svg>',
  privacy: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 1.8l5 2v4c0 3-2.2 5.3-5 6.4-2.8-1.1-5-3.4-5-6.4v-4z" stroke-linejoin="round"/></svg>',
  shield: '<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 1.8l5 2v4c0 3-2.2 5.3-5 6.4-2.8-1.1-5-3.4-5-6.4v-4z" stroke-linejoin="round"/><path d="M5.8 8l1.6 1.6 2.9-3" stroke-linecap="round"/></svg>',
  trash: '<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 9h5.8l.6-9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  link: '<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M7 9a2.5 2.5 0 0 0 3.5 0l2-2A2.5 2.5 0 0 0 9 3.5l-.7.7M9 7a2.5 2.5 0 0 0-3.5 0l-2 2A2.5 2.5 0 0 0 7 12.5l.7-.7" stroke-linecap="round"/></svg>',
  emptyWave: '<svg width="40" height="40" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7.5 13v0M10.5 10v6M13.5 7v12M16.5 10v6M19.5 12v2" stroke-linecap="round"/></svg>',
}

// ---------- token + API ----------
let token = null
;(function initToken() {
  const u = new URL(location.href)
  const t = u.searchParams.get('token')
  if (t) {
    store.set('earshot_token', t)
    u.searchParams.delete('token')
    history.replaceState(null, '', u.pathname + u.search + u.hash)
  }
  token = t || store.get('earshot_token')
})()

class AuthError extends Error {}
async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || (opts.body ? 'POST' : 'GET'),
    headers: { authorization: `Bearer ${token}`, ...(opts.body ? { 'content-type': 'application/json' } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  })
  if (res.status === 401) { signOut('That token was not accepted.'); throw new AuthError('Unauthorized') }
  if (opts.raw) { if (!res.ok) throw new Error(`Request failed (${res.status})`); return res }
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`)
  return data
}

// ---------- markdown (brief) ----------
function inlineMd(s, sources) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>')
    .replace(/\[(\d+)\](?!\()/g, (m, n) => {
      const src = sources.find((x) => String(x.n) === n)
      return src ? `<sup class="cite"><a href="${esc(safeUrl(src.url))}" target="_blank" rel="noopener" title="${esc(src.title)}">${n}</a></sup>` : `<sup class="cite"><a>${n}</a></sup>`
    })
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
}
function renderMd(md, sources = []) {
  const out = []; let list = false
  const close = () => { if (list) { out.push('</ul>'); list = false } }
  for (const raw of String(md || '').split('\n')) {
    const line = raw.trimEnd()
    let m
    if ((m = line.match(/^#{1,2}\s+(.*)/))) { close(); out.push(`<h3>${inlineMd(m[1], sources)}</h3>`) }
    else if ((m = line.match(/^#{3,6}\s+(.*)/))) { close(); out.push(`<h4>${inlineMd(m[1], sources)}</h4>`) }
    else if ((m = line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/))) { if (!list) { out.push('<ul>'); list = true } out.push(`<li>${inlineMd(m[1], sources)}</li>`) }
    else if (!line.trim()) close()
    else { close(); out.push(`<p>${inlineMd(line, sources)}</p>`) }
  }
  close()
  return out.join('')
}

// ---------- record from the browser (same upload the iPhone does: PUT /recordings/:id) ----------
const MAX_REC_MS = 10 * 60_000
let rec = null // { mr, startedAt, timer }
const recLabel = () => `<span class="dot-rec"></span> Stop · ${fmtClock(Date.now() - rec.startedAt)}`
const fmtClock = (ms) => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` }

async function toggleRecord() {
  const btn = $('#rec'), errBox = $('#recerr')
  if (errBox) errBox.innerHTML = ''
  if (rec) { rec.mr.stop(); return }
  let stream
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }) }
  catch { if (errBox) errBox.innerHTML = errHtml(new Error('Microphone access was blocked. Allow it in your browser to record.')); return }
  const mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find((m) => MediaRecorder.isTypeSupported?.(m)) || ''
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined), chunks = []
  rec = { mr, startedAt: Date.now() }
  mr.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data) }
  mr.onstop = () => {
    const { startedAt } = rec
    clearInterval(rec.timer); rec = null
    stream.getTracks().forEach((t) => t.stop())
    uploadRecording(new Blob(chunks, { type: mr.mimeType }), startedAt, Date.now() - startedAt)
  }
  mr.start(1000)
  rec.timer = setInterval(() => {
    if (Date.now() - rec.startedAt >= MAX_REC_MS) return mr.stop()
    const b = $('#rec'); if (b) b.innerHTML = recLabel()
  }, 500)
  if (btn) btn.innerHTML = recLabel()
}

async function uploadRecording(blob, startedAt, durationMs) {
  const btn = $('#rec')
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Uploading' }
  const id = crypto.randomUUID()
  try {
    const res = await fetch(`/recordings/${id}`, {
      method: 'PUT', body: blob,
      // Deepgram wants the bare type ("audio/webm"), not "audio/webm;codecs=opus"
      headers: { authorization: `Bearer ${token}`, 'content-type': (blob.type || 'audio/webm').split(';')[0], 'x-started-at': String(startedAt), 'x-duration-ms': String(durationMs) },
    })
    if (res.status === 401) { signOut('That token was not accepted.'); return }
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Upload failed (${res.status})`)
    recs.unshift({ id, started_at: startedAt, duration_ms: durationMs, status: 'queued' })
    drawTimeline()
    pollRecording(id)
  } catch (e) { const box = $('#recerr'); if (box) box.innerHTML = errHtml(e) }
  const b = $('#rec'); if (b) { b.disabled = false; b.textContent = 'Record here' }
}

// Re-fetch the newest page until the new conversation is done/failed (or gone: "empty" means no speech).
async function pollRecording(id) {
  for (let i = 0; i < 60; i++) {
    await new Promise((r) => setTimeout(r, 4000))
    let page
    try { page = (await api('/recordings?limit=30')).recordings || [] } catch { continue }
    const fresh = page.find((r) => r.id === id), idx = recs.findIndex((r) => r.id === id)
    if (idx < 0) return
    if (!fresh) { recs.splice(idx, 1); drawTimeline(); $('#recerr') && ($('#recerr').innerHTML = '<div class="note">No speech was heard in that recording.</div>'); return }
    recs[idx] = fresh
    if (current === 'timeline') drawTimeline()
    if (['done', 'failed'].includes(fresh.status)) { refreshCounts(); return }
  }
}

          <div class="row-meta"><span>${esc(fmtDur(r.duration_ms))}</span>${r.memories_added ? `<span>${r.memories_added} memor${r.memories_added === 1 ? 'y' : 'ies'}</span>` : ''}</div>

          ${facts.length || lines.length ? `<details><summary>${[facts.length && `${facts.length} fact${facts.length === 1 ? '' : 's'}`, lines.length && 'transcript'].filter(Boolean).join(' · ')}</summary>
            ${facts.length ? `<ul class="facts">${facts.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
            ${lines.length ? `<div class="transcript">${lines.map((l) => { const m = l.match(/^(Speaker \d+|[^:]{1,30}):\s?(.*)$/); return m ? `<p><span class="spk">${esc(m[1])}:</span> ${esc(m[2])}</p>` : `<p>${esc(l)}</p>` }).join('')}</div>`
              : r.status === 'done' ? '<p class="faint" style="font-size:12.5px">Transcript erased after 30 days. Summary and memories remain.</p>' : ''}

function drawTimeline() {
  const tl = $('#tl')
  if (!tl) return
  if (!recs.length) {
    tl.innerHTML = empty('No conversations yet', '<p>Tap record on your Apple Watch. Audio is transcribed, then deleted — what remains shows up here.</p>')
    return
  }
  const groups = []
  for (const r of recs) {
    const k = new Date(r.started_at).toDateString()
    if (groups.at(-1)?.k !== k) groups.push({ k, at: r.started_at, items: [] })
    groups.at(-1).items.push(r)
  }
  tl.innerHTML = groups.map((g) => `<h2 class="group">${esc(fmtDay(g.at))} <span class="n">${g.items.length}</span></h2><div class="card list">${g.items.map(recRow).join('')}</div>`).join('')
    + (recsDone ? '' : '<div class="more"><button class="btn" id="more">Load more</button></div>')
  $('#more')?.addEventListener('click', async (e) => {
    e.target.disabled = true; e.target.innerHTML = '<span class="spin"></span> Loading'
    try { await loadMoreRecs(); drawTimeline() } catch (err) { e.target.insertAdjacentHTML('afterend', errHtml(err)); e.target.disabled = false; e.target.textContent = 'Load more' }
  })
  tl.querySelectorAll('.rec').forEach((row) => row.querySelectorAll('[data-act]').forEach((btn) => btn.onclick = () => recAction(row, btn)))
}

async function recAction(row, btn) {
  const id = row.dataset.id, actions = btn.parentElement
  actions.querySelector('.err, .confirm')?.remove()
  if (btn.dataset.act === 'retry') {
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Retrying'
    try { await api(`/recordings/${encodeURIComponent(id)}/retry`, { method: 'POST' }); const r = recs.find((x) => x.id === id); Object.assign(r, { status: 'queued', error: null }); drawTimeline() }
    catch (e) { actions.insertAdjacentHTML('beforeend', errHtml(e)); btn.disabled = false; btn.textContent = 'Retry' }
    return
  }
  // Forget: inline confirm, no alert().
  actions.insertAdjacentHTML('beforeend', `<div class="confirm err" role="alertdialog" aria-label="Confirm forget" style="width:100%">
    Forget this conversation? Its transcript, its promises and every memory it produced are erased everywhere. This can’t be undone.
    <div class="row-actions"><button class="btn sm danger" data-yes>Forget it</button><button class="btn ghost sm" data-no>Keep</button></div></div>`)
  const box = actions.querySelector('.confirm')
  box.querySelector('[data-no]').onclick = () => box.remove()
  box.querySelector('[data-yes]').focus()
  box.querySelector('[data-yes]').onclick = async (e) => {
    e.target.disabled = true; e.target.innerHTML = '<span class="spin"></span> Forgetting'
    try { await api(`/recordings/${encodeURIComponent(id)}`, { method: 'DELETE' }); recs = recs.filter((x) => x.id !== id); drawTimeline(); refreshCounts() }
    catch (err) { box.insertAdjacentHTML('beforeend', `<p style="margin:8px 0 0">${esc(err.message)}</p>`); e.target.disabled = false; e.target.textContent = 'Forget it' }
  }
}

function forgetMemory(row, onGone) {
  row.querySelector('.confirm')?.remove()
  row.insertAdjacentHTML('beforeend', `<div class="confirm err" role="alertdialog" aria-label="Confirm forget">Forget this memory? Earshot will no longer use it in answers or briefs.
    <div class="row-actions"><button class="btn sm danger" data-yes>Forget it</button><button class="btn ghost sm" data-no>Keep</button></div></div>`)
  const box = row.querySelector('.confirm'), yes = box.querySelector('[data-yes]')
  box.querySelector('[data-no]').onclick = () => box.remove()
  yes.focus()
  yes.onclick = async () => {
    yes.disabled = true; yes.innerHTML = '<span class="spin"></span> Forgetting'
    try { await api(`/memories/${encodeURIComponent(row.dataset.id)}`, { method: 'DELETE' }); onGone(row.dataset.id); row.classList.add('leaving'); setTimeout(() => row.remove(), 250) }
    catch (e) { box.insertAdjacentHTML('beforeend', `<p style="margin:8px 0 0">${esc(e.message)}</p>`); yes.disabled = false; yes.textContent = 'Forget it' }
  }
}

function memRow(m) {
  let content = String(m.content || ''), tag = '', news = false, link = '', clip = ''
  const pm = content.match(/^\[([^\]]+)\]\s*/)
  if (pm) {
    tag = pm[1]; content = content.slice(pm[0].length)
    if (/^news\b/i.test(tag)) { news = true; tag = tag.replace(/^news\s*/i, '') }
    const cm = tag.match(/\s*·\s*clip\s+([0-9a-f-]{36})/i)
    if (cm) { clip = cm[1]; tag = tag.replace(cm[0], '') }
  }
  const sm = content.match(/\s*\(source:\s*(https?:\/\/[^\s)]+)\)\s*$/i)
  if (sm) { link = sm[1]; content = content.slice(0, sm.index) }
  let host = ''
  try { host = link ? new URL(link).hostname.replace(/^www\./, '') : '' } catch {}
  return `<div class="row mem" data-id="${esc(m.id)}">
    <div class="tagline">${news ? '<span class="badge news">NEWS</span>' : ''}${tag ? `<span>${esc(tag)}</span>` : ''}
      ${clip ? `<button class="chip" data-clip="${esc(clip)}" style="font-family:var(--font);font-size:11.5px;padding:0 8px">conversation</button>` : ''}
      ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener" style="font-family:var(--font)">${esc(host)} ↗</a>` : ''}
      ${m.createdAt && !tag ? `<span>${esc(fmtWhen(new Date(m.createdAt).getTime()))}</span>` : ''}
      <button class="btn ghost sm danger" data-forget style="margin-left:auto;font-family:var(--font)" aria-label="Forget this memory">Forget</button></div>
    <div class="content">${esc(content)}</div>
  </div>`
}

VIEWS.memory = (view) => {
  view.innerHTML = `
    <div class="head"><div><h1>Memory</h1><p class="sub">Facts Nemotron kept from your conversations, plus news about the people and companies in them.</p></div></div>
    <form id="memf" role="search"><label for="mq" class="sr">Search memories</label><input id="mq" type="search" placeholder="Search memories — e.g. “Acme pricing”" autocomplete="off"></form>
    <div id="mems" style="margin-top:14px">${loading(6)}</div>`
  let offset = 0, all = []
  const box = $('#mems')
  const draw = (list, more, q) => {
    box.innerHTML = list.length
      ? `${q ? `<p class="faint" style="font-size:12.5px;margin:0 0 8px">${list.length} result${list.length === 1 ? '' : 's'} for “${esc(q)}” · <button class="signout" id="clr" style="margin:0">clear</button></p>` : ''}<div class="card list">${list.map(memRow).join('')}</div>${more ? '<div class="more"><button class="btn" id="mmore">Load more</button></div>' : ''}`
      : q ? `<div class="note">Nothing matches “${esc(q)}”.</div>` : empty('No memories yet', '<p>Each conversation adds a handful of facts here. Every one links back to the conversation it came from, and can be forgotten with it.</p>')
    box.querySelectorAll('[data-clip]').forEach((b) => b.onclick = () => openConversation(b.dataset.clip))
    box.querySelectorAll('[data-forget]').forEach((b) => b.onclick = () => forgetMemory(b.closest('.mem'), (id) => { all = all.filter((x) => x.id !== id); list = list.filter((x) => x.id !== id) }))
    $('#clr')?.addEventListener('click', () => { $('#mq').value = ''; draw(all, all.length === offset, '') })
    $('#mmore')?.addEventListener('click', page)
  }
  async function page() {
    const btn = $('#mmore'); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Loading' }
    try { const r = await api(`/memories?limit=50&offset=${offset}`); const got = r.memories || []; all.push(...got); offset += 50; draw(all, got.length === 50, '') }
    catch (e) { box.innerHTML = errHtml(e) }
  }
  $('#memf').onsubmit = async (e) => {
    e.preventDefault()
    const q = $('#mq').value.trim()
    if (!q) return draw(all, all.length === offset, '')
    box.innerHTML = loading(4)
    try { draw((await api('/memories/search', { body: { query: q } })).memories || [], false, q) }
    catch (err) { box.innerHTML = errHtml(err) }
  }
  $('#mq').addEventListener('search', () => { if (!$('#mq').value) draw(all, all.length === offset, '') })
  page()
}

const MODEL_LABELS = [[/lightning/i, 'Nemotron 3.5 Lightning', '#76b900'], [/super/i, 'Nemotron 3 Super', '#4a8f2a'], [/ultra/i, 'Nemotron 3 Ultra', '#2b5c1a'], [/nova|deepgram/i, 'Deepgram Nova-3', '#8b8bf5']]
const modelInfo = (m) => { const hit = MODEL_LABELS.find(([re]) => re.test(m)); return hit ? { label: hit[1], color: hit[2] } : { label: m, color: '#9a9994' } }

VIEWS.privacy = async (view) => {
  view.innerHTML = `
    <div class="head"><div><h1>Privacy & cost</h1><p class="sub">What Earshot keeps, for how long, and what it costs to run.</p></div>
      <button class="btn" id="export">Export everything</button></div>
    <div id="exmsg" aria-live="polite"></div>
    <div class="pillars">
      <div class="card pillar">${icons.trash}<b>Audio is deleted immediately</b><p>The recording is removed the moment it’s transcribed. Nothing re-listens later.</p></div>
      <div class="card pillar">${icons.shield}<b>Transcripts erased after 30 days</b><p>After that only the short summary and the facts Nemotron kept remain.</p></div>
      <div class="card pillar">${icons.link}<b>Every memory is traceable</b><p>Each fact points to the conversation it came from. Forget a conversation and its memories go with it.</p></div>
    </div>
    <h2 class="group">Running cost · last 14 days</h2>
    <div id="cost">${loading(4)}</div>`
  $('#export').onclick = async () => {
    const btn = $('#export'), msg = $('#exmsg')
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Exporting'; msg.innerHTML = ''
    try {
      const res = await api('/export', { raw: true })
      const name = (res.headers.get('content-disposition') || '').match(/filename="?([^";]+)/)?.[1] || 'earshot-export.json'
      const url = URL.createObjectURL(await res.blob())
      const a = Object.assign(document.createElement('a'), { href: url, download: name })
      document.body.append(a); a.click(); a.remove()
      setTimeout(() => URL.revokeObjectURL(url), 5000)
      msg.innerHTML = `<div class="note">Downloaded ${esc(name)} — recordings, promises, briefs and memories.</div>`
    } catch (e) { msg.innerHTML = errHtml(e) }
    btn.disabled = false; btn.textContent = 'Export everything'
  }
  let usage
  try { usage = (await api('/usage?days=14')).usage || [] }
  catch (e) { $('#cost').innerHTML = errHtml(e); return }
  if (!usage.length) { $('#cost').innerHTML = empty('No usage yet', '<p>Costs appear here after the first conversation is processed.</p>'); return }

  const days = new Map(), models = new Map()
  for (const u of usage) {
    const c = Number(u.cost_usd) || 0
    if (!days.has(u.day)) days.set(u.day, { total: 0, by: {} })
    const d = days.get(u.day); d.total += c; d.by[u.model] = (d.by[u.model] || 0) + c
    const m = models.get(u.model) || { calls: 0, input: 0, output: 0, cost: 0 }
    m.calls += Number(u.calls) || 0; m.input += Number(u.input_tokens) || 0; m.output += Number(u.output_tokens) || 0; m.cost += c
    models.set(u.model, m)
  }
  // Fill the 14-day axis so quiet days show as gaps, not missing bars.
  const axis = [], last = [...days.keys()].sort().at(-1)
  for (let i = 13; i >= 0; i--) { const d = new Date(isoDay(last) - i * 864e5); axis.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`) }
  const total = [...days.values()].reduce((s, d) => s + d.total, 0)
  const active = days.size, max = Math.max(...[...days.values()].map((d) => d.total), 1e-9)
  const order = [...models.keys()].sort((a, b) => models.get(b).cost - models.get(a).cost)
  const calls = [...models.values()].reduce((s, m) => s + m.calls, 0)
  $('#cost').innerHTML = `
    <div class="kpis">
      <div class="card kpi hero"><div class="v">${fmtUsd(total / active)}</div><div class="l">per active day, on average</div></div>
      <div class="card kpi"><div class="v">${fmtUsd(total)}</div><div class="l">total, ${active} active day${active === 1 ? '' : 's'}</div></div>
      <div class="card kpi"><div class="v">${fmtNum(calls)}</div><div class="l">model calls</div></div>
    </div>
    <div class="card chart">
      <div class="bars" role="img" aria-label="Daily cost, last 14 days">${axis.map((day) => {
        const d = days.get(day)
        return `<div class="bar" title="${esc(fmtIsoDay(day))}: ${d ? fmtUsd(d.total) : '$0'}">${d ? order.filter((m) => d.by[m]).map((m) => `<span style="height:${(d.by[m] / max) * 100}%;background:${modelInfo(m).color}"></span>`).join('') : '<span style="height:2px;background:var(--line)"></span>'}</div>`
      }).join('')}</div>
      <div class="bar-x" aria-hidden="true">${axis.map((d, i) => `<span>${i % 2 === 1 || axis.length < 8 ? esc(String(isoDay(d) && new Date(isoDay(d)).getDate())) : ''}</span>`).join('')}</div>
      <div class="legend">${order.map((m) => `<span><i style="background:${modelInfo(m).color}"></i>${esc(modelInfo(m).label)}</span>`).join('')}</div>
    </div>
    <div class="card tablewrap" style="margin-top:12px">
      <table>
        <thead><tr><th scope="col">Model</th><th scope="col">Calls</th><th scope="col">Tokens in</th><th scope="col">Tokens out</th><th scope="col">Cost</th></tr></thead>
        <tbody>${order.map((m) => { const x = models.get(m); return `<tr><td><i style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;background:${modelInfo(m).color}"></i>${esc(modelInfo(m).label)}</td><td>${fmtNum(x.calls)}</td><td>${x.input ? fmtNum(x.input) : '—'}</td><td>${x.output ? fmtNum(x.output) : '—'}</td><td>${fmtUsd(x.cost)}</td></tr>` }).join('')}</tbody>
        <tfoot><tr><td>Total</td><td>${fmtNum(calls)}</td><td></td><td></td><td>${fmtUsd(total)}</td></tr></tfoot>
      </table>
    </div>
    <div class="card tablewrap" style="margin-top:12px">
      <table>
        <thead><tr><th scope="col">Day</th>${order.map((m) => `<th scope="col">${esc(modelInfo(m).label.replace('Nemotron ', ''))}</th>`).join('')}<th scope="col">Total</th></tr></thead>
        <tbody>${[...days.keys()].sort().reverse().map((day) => { const d = days.get(day); return `<tr><td>${esc(fmtIsoDay(day))}</td>${order.map((m) => `<td class="${d.by[m] ? '' : 'faint'}">${d.by[m] ? fmtUsd(d.by[m]) : '—'}</td>`).join('')}<td><b>${fmtUsd(d.total)}</b></td></tr>` }).join('')}</tbody>
      </table>
    </div>
    <p class="faint" style="font-size:12px">Token Factory list prices; Deepgram Nova-3 billed per audio minute via Workers AI.</p>
    <h2 class="group">Model call trace · latest 50</h2>
    <div id="trace">${loading(3)}</div>`
  try {
    const calls = (await api('/usage/calls?limit=50')).calls || []
    $('#trace').innerHTML = !calls.length ? '<div class="note">No model calls recorded yet.</div>' : `<div class="card tablewrap"><table class="trace">
      <thead><tr><th scope="col">When</th><th scope="col">Model</th><th scope="col">Purpose</th><th scope="col">Tokens in / out</th><th scope="col">Latency</th><th scope="col">Cost</th></tr></thead>
      <tbody>${calls.map((c) => `<tr><td class="muted">${esc(fmtWhen(c.ts))}</td><td><i style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;background:${modelInfo(c.model).color}"></i>${esc(modelInfo(c.model).label)}</td><td><span class="chip">${esc(c.purpose)}</span></td><td>${c.input_tokens || c.output_tokens ? `${fmtNum(c.input_tokens)} / ${fmtNum(c.output_tokens)}` : '—'}</td><td>${c.latency_ms != null ? (c.latency_ms >= 1000 ? (c.latency_ms / 1000).toFixed(1) + ' s' : Math.round(c.latency_ms) + ' ms') : '—'}</td><td>${fmtUsd(c.cost_usd)}</td></tr>`).join('')}</tbody></table></div>`
  } catch (e) { $('#trace').innerHTML = errHtml(e) }
}

token ? renderShell() : renderSignIn()
